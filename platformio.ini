[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    bblanchon/ArduinoJson@^6.21.0
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=3

[env:test]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    ${env:esp32dev.lib_deps}
test_framework = unity
